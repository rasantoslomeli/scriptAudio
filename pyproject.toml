[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-speaker-studio"
version = "0.2.0"
description = "Editable, source-linked podcast transcription desktop studio"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "requests>=2.32,<3", "python-docx>=1.1,<2", "reportlab>=4.2,<5", "numpy>=2,<3", "sherpa-onnx==1.13.8", "sherpa-onnx-core==1.13.8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "pyinstaller>=6.11,<7", "cmake>=3.25,<5", "ninja>=1.11,<2"]

[project.scripts]
podcast-speaker-studio = "podcast_studio.app:main"

[tool.setuptools.packages.find]
include = ["podcast_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
