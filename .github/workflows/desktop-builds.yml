name: Desktop tests and native packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked tools
        run: |
          python -m pip install uv==0.12.19
          uv sync --frozen --extra dev
      - name: Run automated tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --frozen --extra dev pytest -q
      - name: Package for the native platform
        run: uv run --frozen --extra dev python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: PodcastSpeakerStudio-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error
